# /etc/nginx/sites-available/elo3d  (o certbot acrescenta o bloco HTTPS sozinho)
server {
    listen 80;
    listen [::]:80;
    server_name elo3d.wmbens.cloud;

    root /var/www/elo3d/dist;
    index index.html;

    client_max_body_size 3m;   # fotos de produto vão em base64 no JSON

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker e entrada do app nunca podem ficar em cache velho.
    location = /sw.js         { add_header Cache-Control "no-cache"; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;   # SPA
    }
}
