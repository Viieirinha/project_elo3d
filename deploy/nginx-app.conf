# Parte "da aplicação" do site elo3d.wmbens.cloud. Instalada em /etc/nginx/snippets/elo3d-app.conf
# e incluída pelo arquivo do site (que o certbot edita). Pode ser atualizada sem tocar no HTTPS:
# rode deploy/aplicar-nginx.sh (o deploy-no-servidor.sh já faz isso).

root /var/www/elo3d/dist;
index index.html;

client_max_body_size 3m;   # fotos de produto vão em base64 no JSON

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Cabeçalhos de segurança (nenhum location abaixo usa add_header, então valem para todos).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Service worker e entrada do app nunca podem ficar em cache velho.
location = /sw.js                { expires -1; }
location = /index.html           { expires -1; }
location = /registerSW.js        { expires -1; }
location = /manifest.webmanifest { expires -1; }

# Arquivos com hash no nome: cache longo.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;   # SPA
}
